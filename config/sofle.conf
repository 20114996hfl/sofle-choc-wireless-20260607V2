# Sofle Choc Wireless configuration

# Split keyboard settings
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_BLE_ADV_IDLE_TIMEOUT=300000

# Bluetooth settings
CONFIG_BT=y
CONFIG_BT_NAME="Sofle Choc"
CONFIG_BT_MAX_CONN=5
CONFIG_BT_CTLR=y
CONFIG_BT_CTLR_ADV_EXT=y
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_ADV_NAME="SofleChoc"

# Keyboard scan settings
CONFIG_ZMK_KSCAN_MATRIX_SCAN_TIMER=5
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Power management
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_SLEEP_TIMEOUT=600000
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# Key behaviors
CONFIG_ZMK_BEHAVIOR_TAP_DANCE=y
CONFIG_ZMK_BEHAVIOR_HOLD_TAP=y
CONFIG_ZMK_BEHAVIOR_LAYER_TAP=y
CONFIG_ZMK_BEHAVIOR_ONESHOT=y
CONFIG_ZMK_BEHAVIOR_MACRO=y
CONFIG_ZMK_BEHAVIOR_ENCODER=y

# HID reports
CONFIG_ZMK_HID_KBD=y
CONFIG_ZMK_HID_MOUSE=y
CONFIG_ZMK_HID_CONSUMER=y

# OLED display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN=y
CONFIG_ZMK_DISPLAY_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_DISPLAY_WIDGET_BLUETOOTH_STATUS=y
CONFIG_ZMK_DISPLAY_WIDGET_BATTERY_STATUS=y
CONFIG_SSD1306=y
CONFIG_I2C=y

# RGB LED
CONFIG_ZMK_RGB=y
CONFIG_WS2812=y

# Encoder
CONFIG_ZMK_ENCODER=y

# ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_BLE=y
CONFIG_ZMK_STUDIO_USB=y
CONFIG_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
