manifest:
  defaults:
    # Pinned ZMK main snapshot with Studio and Sofle physical-layout support.
    revision: 6e2ef41e022d555b10f116e395832913f71717b3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
  self:
    path: config
