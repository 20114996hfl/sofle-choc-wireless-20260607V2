# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y

# Uncomment these two lines to add support for encoders
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# enable deep sleep to save power
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Uncomment the line below to increase Bluetooth TX power by 8dBm
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Optional: improve Bluetooth connection stability
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Reduce dropped events during fast typing on split BLE
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=16
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=16
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_POSITION_QUEUE_SIZE=24

# Enable RGB per-key backlight (WS2812 LEDs)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=50
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=200
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Enable WS2812 LED driver
CONFIG_WS2812_STRIP=y
CONFIG_LED_STRIP=y

### ZMK STUDIO
# MC: 2. zmk-studio test START
# https://github.com/zmkfirmware/zmk/blob/main/docs/docs/config/studio.md
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
# MC: zmk-studio test END

# Note: ZMK Studio (CONFIG_ZMK_STUDIO) requires ZMK v0.4+. The pinned
# ZMK v0.3 source does not include it; this config will be silently
# ignored and the build will succeed but the firmware will not expose
# a Studio interface. To make Studio functional, the build must use
# a v0.4+ ZMK source (see requirements doc for details).