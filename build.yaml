include:
  # Standalone BLE: left half acts as central, right as peripheral.
  # Only build the two firmware files used by this keyboard.
  - board: nice_nano//zmk
    shield: sofle_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
  - board: nice_nano//zmk
    shield: sofle_right
