include:
  # Standalone BLE: left half acts as central, right as peripheral.
  # Flash these when running WITHOUT the USB dongle.
  - board: nice_nano//zmk
    shield: sofle_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
  - board: nice_nano//zmk
    shield: sofle_right

  # USB dongle setup: the dongle is the BLE central + USB HID output,
  # both halves become peripherals. Flash all three when running WITH the dongle.
  - board: nice_nano//zmk
    shield: sofle_dongle
    artifact-name: sofle_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
  - board: nice_nano//zmk
    shield: sofle_left
    artifact-name: sofle_left_peripheral
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: nice_nano//zmk
    shield: sofle_right
    artifact-name: sofle_right_peripheral
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  # Flash once to each controller before the normal firmware to clear saved
  # RGB brightness/on-off state. This also clears Bluetooth pairings.
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset
